<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Color Switch Orbit · GameVerse 307</title>
  <meta name="monetag-zone" content="12242572" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="./gamerverse-bridge.js?v=20261112"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #040716;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: radial-gradient(circle at 50% 40%, #0a1030 0%, #040716 100%);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 6px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(6, 10, 30, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      z-index: 20;
    }
    .hud-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hud-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #7b8dbb;
      text-transform: uppercase;
    }
    .hud-val {
      font-family: 'Orbitron', monospace;
      font-size: 26px;
      font-weight: 900;
      color: #00f0ff;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
      line-height: 1.1;
    }
    .btn-ctrl {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-ctrl:active {
      transform: scale(0.95);
    }
    #canvas-wrap {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Modales */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 5, 18, 0.88);
      backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
      text-align: center;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      width: 100%;
      max-width: 330px;
      background: rgba(14, 20, 50, 0.95);
      border: 1px solid rgba(255, 71, 87, 0.4);
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: 0 0 35px rgba(255, 71, 87, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .modal-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: 900;
      color: #ff4757;
      text-shadow: 0 0 14px rgba(255, 71, 87, 0.6);
    }
    .modal-score {
      font-family: 'Orbitron', monospace;
      font-size: 40px;
      font-weight: 900;
      color: #ffd32a;
      text-shadow: 0 0 20px rgba(255, 211, 42, 0.6);
    }
    .btn-action {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-revive {
      background: linear-gradient(135deg, #ffd32a 0%, #ff9f43 100%);
      color: #050713;
      box-shadow: 0 0 20px rgba(255, 211, 42, 0.4);
    }
    .btn-retry {
      background: linear-gradient(135deg, #00f0ff 0%, #0072ff 100%);
      color: #fff;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.35);
    }
    .btn-hub {
      background: transparent;
      color: #7b8dbb;
      border: 1px solid rgba(123, 141, 187, 0.25);
      font-size: 11px;
    }
    .toast {
      position: absolute;
      top: 75px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(0, 240, 255, 0.95);
      color: #050713;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 800;
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
      pointer-events: none;
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 80;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <header>
      <button class="btn-ctrl" id="btn-back">🏠 Hub</button>
      <div class="hud-stat">
        <span class="hud-label">Estrellas</span>
        <span class="hud-val" id="hud-score">0</span>
      </div>
      <div style="font-family: 'Orbitron', monospace; font-size: 12px; color: #ffd32a;">
        Récord: <span id="hud-best">0</span>
      </div>
      <button class="btn-ctrl" id="btn-sound">🔊</button>
    </header>

    <div id="canvas-wrap">
      <canvas id="game-canvas"></canvas>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Modal Game Over -->
    <div class="modal-overlay" id="modal-gameover">
      <div class="modal-card">
        <div style="font-size: 40px;">💥</div>
        <h2 class="modal-title">¡COLOR INCORRECTO!</h2>
        <p style="font-size: 13px; color: #a4b0be;">Chocaste con un sector de distinto color.</p>
        <div>
          <div style="font-size: 11px; text-transform: uppercase; color: #7b8dbb; letter-spacing: 1px;">Estrellas Recogidas</div>
          <div class="modal-score" id="final-score">0</div>
        </div>

        <button class="btn-action btn-revive" id="btn-revive">
          <span>📺</span> ESCUDO PRISMA (1 AD)
        </button>

        <button class="btn-action btn-retry" id="btn-retry">
          <span>🔄</span> JUGAR OTRA VEZ (1 🎟️)
        </button>

        <button class="btn-action btn-hub" id="btn-exit-hub">
          VOLVER AL HUB ARCADE
        </button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // --- 4 COLORES NEÓN DISTINTOS ---
      const COLORS = ['#00f0ff', '#ff007f', '#ffd32a', '#a29bfe']; // Cyan, Magenta, Amarillo, Violeta

      // --- AUDIO PROCEDURAL SINTETIZADO ---
      let audioCtx = null;
      let soundEnabled = true;

      function initAudio() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      }

      function playTone(freq, dur, type = 'sine', gainVal = 0.08) {
        if (!soundEnabled || !audioCtx) return;
        try {
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(gainVal, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + dur);
        } catch (_) {}
      }

      function playJumpSound() {
        playTone(380, 0.08, 'sine', 0.07);
      }

      function playStarChime() {
        playTone(587, 0.09, 'triangle', 0.08);
        setTimeout(() => playTone(880, 0.15, 'triangle', 0.09), 40);
      }

      function playPrismChime() {
        playTone(440, 0.1, 'sine', 0.08);
        setTimeout(() => playTone(659, 0.12, 'sine', 0.08), 50);
        setTimeout(() => playTone(880, 0.16, 'sine', 0.08), 100);
      }

      function playShatterSound() {
        playTone(140, 0.35, 'sawtooth', 0.15);
      }

      // --- ELEMENTOS DOM ---
      const canvasWrap = document.getElementById('canvas-wrap');
      const canvas = document.getElementById('game-canvas');
      const ctx = canvas.getContext('2d');
      const hudScore = document.getElementById('hud-score');
      const hudBest = document.getElementById('hud-best');
      const modalGameOver = document.getElementById('modal-gameover');
      const finalScoreEl = document.getElementById('final-score');
      const btnRevive = document.getElementById('btn-revive');
      const btnRetry = document.getElementById('btn-retry');
      const btnBack = document.getElementById('btn-back');
      const btnExitHub = document.getElementById('btn-exit-hub');
      const btnSound = document.getElementById('btn-sound');
      const toastEl = document.getElementById('toast');

      function showToast(text) {
        toastEl.innerText = text;
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), 2200);
      }

      // --- PARÁMETROS DEL JUEGO ---
      let width = 0;
      let height = 0;
      let dpr = 1;
      let score = 0;
      let bestScore = parseInt(localStorage.getItem('gv_colorswitch_best') || '0', 10);
      let gameState = 'START'; // 'START', 'PLAYING', 'GAMEOVER'
      let screenShake = 0;

      // Publicidad: cada 2 minutos
      const INTERSTITIAL_INTERVAL_MS = 120000;
      let lastInterstitialAdTime = Date.now();
      let hasRevivedThisRun = false;

      // Bola del jugador
      let player = {
        y: 0,
        vy: 0,
        radius: 11,
        colorIndex: 0,
        invulnerableTime: 0
      };

      let cameraY = 0;
      let obstacles = [];
      let stars = [];
      let colorSwitchers = [];
      let particles = [];

      // --- GENERACIÓN DE OBSTÁCULOS INFINITOS PROCEDURALES ---
      let nextObstacleY = 0;
      const OBSTACLE_SPACING = 300;

      function spawnObstacle(y) {
        // Tipos: 0 = Círculo simple, 1 = Cuadrado rotatorio, 2 = Doble círculo concéntrico
        const type = Math.floor(Math.random() * 3);
        const rotSpeed = (0.015 + Math.random() * 0.015) * (Math.random() < 0.5 ? 1 : -1);

        obstacles.push({
          y: y,
          type: type,
          angle: 0,
          rotSpeed: rotSpeed,
          radius: 80,
          innerRadius: 55
        });

        // Estrella coleccionable en el centro del obstáculo
        stars.push({
          y: y,
          collected: false,
          anim: Math.random()
        });

        // Prisma cambiador de color entre obstáculos
        colorSwitchers.push({
          y: y - OBSTACLE_SPACING * 0.5,
          collected: false,
          anim: Math.random()
        });
      }

      function initObstacles() {
        obstacles = [];
        stars = [];
        colorSwitchers = [];
        nextObstacleY = height * 0.5;

        // Generar los primeros 6 obstáculos
        for (let i = 0; i < 6; i++) {
          spawnObstacle(nextObstacleY);
          nextObstacleY -= OBSTACLE_SPACING;
        }
      }

      // --- AJUSTE RESPONSIVE CANVAS ---
      function resize() {
        const rect = canvasWrap.getBoundingClientRect();
        width = rect.width;
        height = rect.height;
        dpr = window.devicePixelRatio || 1;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.resetTransform ? ctx.resetTransform() : ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);

        if (gameState === 'START') {
          player.y = height * 0.75;
          cameraY = player.y - height * 0.7;
          initObstacles();
        }
      }
      window.addEventListener('resize', resize);
      window.addEventListener('orientationchange', () => setTimeout(resize, 200));

      // --- CONTROLES: TOQUE PARA SALTAR HACIA ARRIBA ---
      function handleJump() {
        initAudio();
        if (gameState === 'GAMEOVER') return;

        if (gameState === 'START') {
          gameState = 'PLAYING';
        }

        player.vy = -7.8; // Impulso hacia arriba
        playJumpSound();

        // Partículas de salto
        for (let i = 0; i < 4; i++) {
          particles.push({
            x: width / 2 + (Math.random() - 0.5) * 8,
            y: player.y + 10,
            vx: (Math.random() - 0.5) * 2,
            vy: 2 + Math.random() * 2,
            color: COLORS[player.colorIndex],
            size: 2 + Math.random() * 3,
            alpha: 1
          });
        }
      }

      canvasWrap.addEventListener('mousedown', handleJump);
      canvasWrap.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleJump();
      }, { passive: false });

      // --- FÍSICA Y DETECCIÓN DE COLISIÓN (60 FPS) ---
      function updatePhysics() {
        if (gameState !== 'PLAYING') return;

        // Gravedad de la bola
        player.vy += 0.38;
        player.y += player.vy;

        // Cámara sigue a la bola solo cuando asciende (no desciende hacia atrás)
        const targetCamY = player.y - height * 0.65;
        if (targetCamY < cameraY) {
          cameraY = targetCamY;
        }

        // Si la bola cae por debajo de la parte inferior visible de la pantalla: Game Over
        if (player.y - cameraY > height + 30) {
          triggerGameOver();
          return;
        }

        // Generar más obstáculos conforme asciende
        if (player.y - nextObstacleY < height * 1.5) {
          spawnObstacle(nextObstacleY);
          nextObstacleY -= OBSTACLE_SPACING;
        }

        const cx = width / 2;
        const isInvuln = Date.now() < player.invulnerableTime;

        // 1. Detección con estrellas
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          if (!s.collected && Math.abs(player.y - s.y) < player.radius + 14) {
            s.collected = true;
            score++;
            hudScore.innerText = score;
            if (score > bestScore) {
              bestScore = score;
              localStorage.setItem('gv_colorswitch_best', bestScore);
              hudBest.innerText = bestScore;
            }
            playStarChime();
            showToast('+1 ⭐');
          }
        }

        // 2. Detección con prismas de cambio de color
        for (let i = 0; i < colorSwitchers.length; i++) {
          const cs = colorSwitchers[i];
          if (!cs.collected && Math.abs(player.y - cs.y) < player.radius + 12) {
            cs.collected = true;
            // Elegir un color distinto al actual
            let newColorIndex = (player.colorIndex + 1 + Math.floor(Math.random() * 3)) % 4;
            player.colorIndex = newColorIndex;
            playPrismChime();
            showToast('✦ ¡NUEVO COLOR!');
          }
        }

        // 3. Detección de colisión con obstáculos geométricos
        for (let i = 0; i < obstacles.length; i++) {
          const ob = obstacles[i];
          ob.angle += ob.rotSpeed;

          // Si el jugador está verticalmente en el rango del obstáculo
          const distToCenter = Math.abs(player.y - ob.y);
          if (distToCenter < ob.radius + player.radius && distToCenter > ob.radius - 22) {
            if (isInvuln) continue; // Con escudo prisma ignora daño

            // Determinar qué segmento de color se cruza en la posición del jugador
            // El jugador se mueve por la línea central x = cx
            const hitAngle = Math.atan2(player.y - ob.y, 0) - ob.angle;
            let normAngle = hitAngle % (Math.PI * 2);
            if (normAngle < 0) normAngle += Math.PI * 2;

            // Cada obstáculo se divide en 4 cuadrantes de color (PI / 2 cada uno)
            const sectorIndex = Math.floor(normAngle / (Math.PI / 2)) % 4;

            if (sectorIndex !== player.colorIndex) {
              // ¡COLOR INCORRECTO: EXPLOSIÓN!
              triggerGameOver();
              return;
            }
          }
        }

        // 4. Actualizar partículas
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= 0.04;
          if (p.alpha <= 0) particles.splice(i, 1);
        }

        if (screenShake > 0) screenShake *= 0.85;
      }

      // --- DIBUJADO EN CANVAS (60 FPS) ---
      function draw() {
        ctx.clearRect(0, 0, width, height);

        ctx.save();
        if (screenShake > 0.5) {
          ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        }

        const cx = width / 2;

        // 1. Dibujar Obstáculos
        for (let i = 0; i < obstacles.length; i++) {
          const ob = obstacles[i];
          const sy = ob.y - cameraY;
          if (sy < -120 || sy > height + 120) continue;

          ctx.save();
          ctx.translate(cx, sy);
          ctx.rotate(ob.angle);

          // Dibujar los 4 arcos de color
          const segAngle = Math.PI / 2;
          for (let s = 0; s < 4; s++) {
            ctx.save();
            ctx.strokeStyle = COLORS[s];
            ctx.shadowColor = COLORS[s];
            ctx.shadowBlur = 12;
            ctx.lineWidth = 14;
            ctx.lineCap = 'round';

            ctx.beginPath();
            ctx.arc(0, 0, ob.radius, s * segAngle + 0.08, (s + 1) * segAngle - 0.08);
            ctx.stroke();

            // Si es doble círculo concéntrico
            if (ob.type === 2) {
              ctx.lineWidth = 10;
              ctx.beginPath();
              ctx.arc(0, 0, ob.innerRadius, s * segAngle + 0.1, (s + 1) * segAngle - 0.1);
              ctx.stroke();
            }
            ctx.restore();
          }
          ctx.restore();
        }

        // 2. Dibujar Estrellas coleccionables
        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          if (st.collected) continue;
          const sy = st.y - cameraY;
          if (sy < -40 || sy > height + 40) continue;

          st.anim += 0.06;
          const pulse = Math.sin(st.anim) * 2;

          ctx.save();
          ctx.fillStyle = '#ffd32a';
          ctx.shadowColor = '#ffd32a';
          ctx.shadowBlur = 14;
          ctx.font = `${20 + pulse}px Outfit`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('⭐', cx, sy);
          ctx.restore();
        }

        // 3. Dibujar Prismas cambiadores de color
        for (let i = 0; i < colorSwitchers.length; i++) {
          const cs = colorSwitchers[i];
          if (cs.collected) continue;
          const sy = cs.y - cameraY;
          if (sy < -40 || sy > height + 40) continue;

          cs.anim += 0.05;
          ctx.save();
          ctx.translate(cx, sy);
          ctx.rotate(cs.anim);
          for (let s = 0; s < 4; s++) {
            ctx.fillStyle = COLORS[s];
            ctx.beginPath();
            ctx.arc(0, 0, 10, s * (Math.PI / 2), (s + 1) * (Math.PI / 2));
            ctx.lineTo(0, 0);
            ctx.fill();
          }
          ctx.restore();
        }

        // 4. Dibujar al Jugador (Orbe de Neón)
        const playerScreenY = player.y - cameraY;
        ctx.save();
        const pColor = COLORS[player.colorIndex];
        ctx.fillStyle = pColor;
        ctx.shadowColor = pColor;
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(cx, playerScreenY, player.radius, 0, Math.PI * 2);
        ctx.fill();

        // Núcleo blanco brillante
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(cx, playerScreenY, player.radius * 0.45, 0, Math.PI * 2);
        ctx.fill();

        // Aura si tiene escudo de invulnerabilidad
        if (Date.now() < player.invulnerableTime) {
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(cx, playerScreenY, player.radius + 6, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();

        // 5. Partículas
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          ctx.save();
          ctx.globalAlpha = pt.alpha;
          ctx.fillStyle = pt.color;
          ctx.shadowColor = pt.color;
          ctx.shadowBlur = 6;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y - cameraY, pt.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Mensaje inicial de toque
        if (gameState === 'START') {
          ctx.save();
          ctx.fillStyle = '#00f0ff';
          ctx.shadowColor = '#00f0ff';
          ctx.shadowBlur = 12;
          ctx.font = '800 16px Orbitron';
          ctx.textAlign = 'center';
          ctx.fillText('TOCA PARA SALTAR', cx, playerScreenY + 50);
          ctx.restore();
        }

        ctx.restore();
      }

      // --- BUCLE PRINCIPAL (60 FPS) ---
      function loop() {
        updatePhysics();
        draw();
        requestAnimationFrame(loop);
      }

      // --- GAME OVER & REVIVIR ---
      function triggerGameOver() {
        gameState = 'GAMEOVER';
        screenShake = 16;
        playShatterSound();
        finalScoreEl.innerText = score;
        modalGameOver.classList.add('active');

        // Partículas de estallido
        for (let i = 0; i < 24; i++) {
          const angle = Math.random() * Math.PI * 2;
          const spd = 2 + Math.random() * 8;
          particles.push({
            x: width / 2,
            y: player.y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            color: COLORS[player.colorIndex],
            size: 3 + Math.random() * 4,
            alpha: 1
          });
        }

        if (window.GamerVerse) {
          window.GamerVerse.submitScore('color_switch', score, 0);
        }

        if (hasRevivedThisRun) {
          btnRevive.style.display = 'none';
        } else {
          btnRevive.style.display = 'flex';
          btnRevive.disabled = false;
        }
      }

      function reviveGame() {
        btnRevive.disabled = true;
        btnRevive.innerText = 'Cargando...';

        const onReward = () => {
          hasRevivedThisRun = true;
          modalGameOver.classList.remove('active');
          gameState = 'PLAYING';
          lastInterstitialAdTime = Date.now();

          // Reposicionar al jugador arriba con 5 segundos de invulnerabilidad
          player.vy = -6;
          player.invulnerableTime = Date.now() + 5000;
          showToast('🛡️ ¡ESCUDO PRISMA ACTIVO!');
        };

        if (window.GamerVerse && typeof window.GamerVerse.showRewardedAd === 'function') {
          window.GamerVerse.showRewardedAd(onReward, (err) => {
            btnRevive.disabled = false;
            btnRevive.innerText = '📺 ESCUDO PRISMA (1 AD)';
          });
        } else {
          onReward();
        }
      }

      function resetNewGame() {
        modalGameOver.classList.remove('active');

        if (window.GamerVerse && !window.GamerVerse.canPlay()) {
          window.GamerVerse.showNoTicketsModal(() => resetNewGame());
          return;
        }
        if (window.GamerVerse) {
          window.GamerVerse.consumeTicket();
        }

        const startFresh = () => {
          score = 0;
          hudScore.innerText = score;
          hasRevivedThisRun = false;
          player.y = height * 0.75;
          player.vy = 0;
          player.colorIndex = 0;
          player.invulnerableTime = 0;
          cameraY = player.y - height * 0.7;
          particles = [];
          initObstacles();
          gameState = 'START';
        };

        const now = Date.now();
        if (now - lastInterstitialAdTime >= INTERSTITIAL_INTERVAL_MS && window.GamerVerse && typeof window.GamerVerse.showInterstitialAd === 'function') {
          lastInterstitialAdTime = now;
          window.GamerVerse.showInterstitialAd(startFresh);
        } else {
          startFresh();
        }
      }

      // --- BOTONES ---
      btnRevive.addEventListener('click', reviveGame);
      btnRetry.addEventListener('click', resetNewGame);
      btnSound.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        btnSound.innerText = soundEnabled ? '🔊' : '🔇';
      });
      btnBack.addEventListener('click', () => {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'GV_CLOSE_GAME' }, '*');
        } else {
          window.location.href = '../index.html';
        }
      });
      btnExitHub.addEventListener('click', () => {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'GV_CLOSE_GAME' }, '*');
        } else {
          window.location.href = '../index.html';
        }
      });

      // --- INICIALIZACIÓN ---
      function init() {
        resize();
        hudBest.innerText = bestScore;

        if (window.GamerVerse && typeof window.GamerVerse.canPlay === 'function' && !window.GamerVerse.canPlay()) {
          window.GamerVerse.showNoTicketsModal(() => init());
          return;
        }
        if (window.GamerVerse && typeof window.GamerVerse.consumeTicket === 'function') {
          window.GamerVerse.consumeTicket();
        }

        requestAnimationFrame(loop);
      }

      window.addEventListener('DOMContentLoaded', init);
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        init();
      }
    })();
  </script>
</body>
</html>
