<!DOCTYPE html>
<html lang="es">
<head>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #030612;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 520px;
      margin: 0 auto;
      background: radial-gradient(circle at 50% 30%, #0c122e 0%, #030612 100%);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(6, 10, 28, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      z-index: 20;
    }
    .hud-title-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hud-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #7b8dbb;
      text-transform: uppercase;
    }
    .hud-val {
      font-family: 'Orbitron', monospace;
      font-size: 26px;
      font-weight: 900;
      color: #00f0ff;
      text-shadow: 0 0 14px rgba(0, 240, 255, 0.6);
      line-height: 1.1;
    }
    .btn-ctrl {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-ctrl:active {
      transform: scale(0.95);
    }
    #progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      position: relative;
      z-index: 10;
    }
    #progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00f0ff, #00ff88);
      box-shadow: 0 0 8px #00f0ff;
      transition: width 0.1s linear;
    }
    #canvas-wrap {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Modales */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 5, 18, 0.88);
      backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
      text-align: center;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      width: 100%;
      max-width: 330px;
      background: rgba(14, 20, 48, 0.95);
      border: 1px solid rgba(255, 71, 87, 0.4);
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: 0 0 35px rgba(255, 71, 87, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .modal-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: 900;
      color: #ff4757;
      text-shadow: 0 0 14px rgba(255, 71, 87, 0.6);
    }
    .modal-score {
      font-family: 'Orbitron', monospace;
      font-size: 42px;
      font-weight: 900;
      color: #00f0ff;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
    }
    .btn-action {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-revive {
      background: linear-gradient(135deg, #ffd32a 0%, #ff9f43 100%);
      color: #050713;
      box-shadow: 0 0 20px rgba(255, 211, 42, 0.4);
    }
    .btn-retry {
      background: linear-gradient(135deg, #00f0ff 0%, #0072ff 100%);
      color: #fff;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.35);
    }
    .btn-hub {
      background: transparent;
      color: #7b8dbb;
      border: 1px solid rgba(123, 141, 187, 0.25);
      font-size: 11px;
    }
    .toast {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(0, 240, 255, 0.95);
      color: #050713;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 800;
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
      pointer-events: none;
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 80;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <header>
      <button class="btn-ctrl" id="btn-back">🏠 Hub</button>
      <div class="hud-title-wrap">
        <span class="hud-label">Piso / Nivel</span>
        <span class="hud-val" id="hud-floor">1</span>
      </div>
      <div style="font-family: 'Orbitron', monospace; font-size: 13px; color: #ffd32a;">
        Récord: <span id="hud-best">0</span>
      </div>
      <button class="btn-ctrl" id="btn-sound">🔊</button>
    </header>

    <div id="progress-bar-wrap">
      <div id="progress-bar"></div>
    </div>

    <div id="canvas-wrap">
      <canvas id="game-canvas"></canvas>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Modal Game Over -->
    <div class="modal-overlay" id="modal-gameover">
      <div class="modal-card">
        <div style="font-size: 40px;">💥</div>
        <h2 class="modal-title">¡ZONA ROJA!</h2>
        <p style="font-size: 13px; color: #a4b0be;">Tocaste el sector de antimateria.</p>
        <div>
          <div style="font-size: 11px; text-transform: uppercase; color: #7b8dbb; letter-spacing: 1px;">Pisos Descendidos</div>
          <div class="modal-score" id="final-score">1</div>
        </div>

        <button class="btn-action btn-revive" id="btn-revive">
          <span>📺</span> REVIVIR CON SUPERNOVA (1 AD)
        </button>

        <button class="btn-action btn-retry" id="btn-retry">
          <span>🔄</span> REINTENTAR (1 🎟️)
        </button>

        <button class="btn-action btn-hub" id="btn-exit-hub">
          VOLVER AL HUB ARCADE
        </button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // --- AUDIO PROCEDURAL SINTETIZADO ---
      let audioCtx = null;
      let soundEnabled = true;

      function initAudio() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      }

      function playTone(freq, dur, type = 'sine', gainVal = 0.08) {
        if (!soundEnabled || !audioCtx) return;
        try {
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(gainVal, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + dur);
        } catch (_) {}
      }

      function playBounceSound(combo) {
        const notes = [330, 392, 440, 523, 587, 659, 783, 880];
        const freq = notes[Math.min(notes.length - 1, combo)];
        playTone(freq, 0.1, 'triangle', 0.08);
      }

      function playSmashSound() {
        playTone(160, 0.28, 'sawtooth', 0.12);
        playTone(320, 0.18, 'square', 0.08);
      }

      function playFireballWhoosh() {
        playTone(220, 0.15, 'sawtooth', 0.06);
      }

      // --- ELEMENTOS DOM ---
      const canvasWrap = document.getElementById('canvas-wrap');
      const canvas = document.getElementById('game-canvas');
      const ctx = canvas.getContext('2d');
      const hudFloor = document.getElementById('hud-floor');
      const hudBest = document.getElementById('hud-best');
      const progressBar = document.getElementById('progress-bar');
      const modalGameOver = document.getElementById('modal-gameover');
      const finalScoreEl = document.getElementById('final-score');
      const btnRevive = document.getElementById('btn-revive');
      const btnRetry = document.getElementById('btn-retry');
      const btnBack = document.getElementById('btn-back');
      const btnExitHub = document.getElementById('btn-exit-hub');
      const btnSound = document.getElementById('btn-sound');
      const toastEl = document.getElementById('toast');

      function showToast(text) {
        toastEl.innerText = text;
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), 2200);
      }

      // --- PARÁMETROS DEL JUEGO & FÍSICA ---
      let width = 0;
      let height = 0;
      let dpr = 1;
      let score = 0;
      let bestScore = parseInt(localStorage.getItem('gv_helix_best') || '0', 10);
      let gameState = 'PLAYING'; // 'PLAYING', 'GAMEOVER'
      let screenShake = 0;

      // Publicidad: cada 2 minutos
      const INTERSTITIAL_INTERVAL_MS = 120000;
      let lastInterstitialAdTime = Date.now();
      let hasRevivedThisRun = false;

      // Torre cilíndrica y física
      const TOWER_RADIUS_X = 140;
      const TOWER_RADIUS_Y = 38; // Elipse perspectiva 3D
      const PILLAR_RADIUS = 28;
      const FLOOR_SPACING = 160;
      const TOTAL_LEVEL_FLOORS = 40;

      let towerAngle = 0;
      let towerAngularVel = 0;
      let isDragging = false;
      let lastTouchX = 0;

      // Bola
      let ball = {
        worldY: 0,
        vy: 0,
        radius: 12,
        bouncing: false,
        consecutiveFalls: 0, // Si es >= 3 entra en modo Supernova / Fireball
        isFireball: false,
        invulnerableTime: 0,
        splats: [] // Salpicaduras de pintura dejadas en las plataformas
      };

      let cameraY = 0;
      let floors = [];
      let particles = [];

      // --- GENERACIÓN DE LA TORRE HELICOIDAL ---
      function createLevel() {
        floors = [];
        for (let i = 0; i <= TOTAL_LEVEL_FLOORS; i++) {
          const worldY = i * FLOOR_SPACING;
          if (i === TOTAL_LEVEL_FLOORS) {
            // Piso meta final victorioso
            floors.push({
              index: i,
              worldY: worldY,
              isGoal: true,
              shattered: false,
              sectors: [{ startAngle: 0, endAngle: Math.PI * 2, type: 'GOAL' }]
            });
            continue;
          }

          // Dividir el disco en 8 sectores (45° cada uno)
          const numSectors = 8;
          const sectorSpan = (Math.PI * 2) / numSectors;
          const sectors = [];

          // Seleccionar 1 o 2 huecos por piso
          const gapIndex1 = Math.floor(Math.random() * numSectors);
          const gapIndex2 = Math.random() < 0.35 ? (gapIndex1 + 1) % numSectors : -1;

          // Seleccionar 1 o 2 zonas rojas de antimateria peligrosa (no en los primeros 2 pisos)
          const dangerIndices = [];
          if (i >= 2) {
            const dangerCount = 1 + Math.floor(Math.random() * 2);
            for (let d = 0; d < dangerCount; d++) {
              const randIdx = Math.floor(Math.random() * numSectors);
              if (randIdx !== gapIndex1 && randIdx !== gapIndex2 && !dangerIndices.includes(randIdx)) {
                dangerIndices.push(randIdx);
              }
            }
          }

          for (let s = 0; s < numSectors; s++) {
            if (s === gapIndex1 || s === gapIndex2) continue; // Hueco
            const type = dangerIndices.includes(s) ? 'DANGER' : 'NORMAL';
            sectors.push({
              startAngle: s * sectorSpan,
              endAngle: (s + 1) * sectorSpan,
              type: type
            });
          }

          floors.push({
            index: i,
            worldY: worldY,
            isGoal: false,
            shattered: false,
            sectors: sectors
          });
        }
      }

      // --- AJUSTE RESPONSIVE CANVAS ---
      function resize() {
        const rect = canvasWrap.getBoundingClientRect();
        width = rect.width;
        height = rect.height;
        dpr = window.devicePixelRatio || 1;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.resetTransform ? ctx.resetTransform() : ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
      }
      window.addEventListener('resize', resize);
      window.addEventListener('orientationchange', () => setTimeout(resize, 200));

      // --- CONTROLES TÁCTILES: ROTAR LA TORRE ---
      function handleTouchStart(e) {
        initAudio();
        if (gameState !== 'PLAYING') return;
        isDragging = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        lastTouchX = clientX;
      }

      function handleTouchMove(e) {
        if (!isDragging || gameState !== 'PLAYING') return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const deltaX = clientX - lastTouchX;
        lastTouchX = clientX;
        // Rotación con sensibilidad fluida
        towerAngle += deltaX * 0.015;
        towerAngularVel = deltaX * 0.015;
      }

      function handleTouchEnd() {
        isDragging = false;
      }

      canvasWrap.addEventListener('mousedown', handleTouchStart);
      window.addEventListener('mousemove', handleTouchMove);
      window.addEventListener('mouseup', handleTouchEnd);

      canvasWrap.addEventListener('touchstart', handleTouchStart, { passive: true });
      window.addEventListener('touchmove', handleTouchMove, { passive: true });
      window.addEventListener('touchend', handleTouchEnd, { passive: true });

      // --- PARTÍCULAS & EFECTOS ---
      function spawnShatterEffect(floorY, color) {
        screenShake = 14;
        playSmashSound();
        for (let i = 0; i < 22; i++) {
          const angle = Math.random() * Math.PI * 2;
          const spd = 3 + Math.random() * 8;
          particles.push({
            x: width / 2 + Math.cos(angle) * (PILLAR_RADIUS + Math.random() * (TOWER_RADIUS_X - PILLAR_RADIUS)),
            y: height * 0.42,
            vx: Math.cos(angle) * spd,
            vy: -4 + Math.random() * 8,
            color: color || '#00f0ff',
            size: 3 + Math.random() * 5,
            alpha: 1
          });
        }
      }

      // --- ACTUALIZACIÓN DE FÍSICA (60 FPS) ---
      function updatePhysics() {
        if (gameState !== 'PLAYING') return;

        // Fricción angular suave cuando se suelta el dedo
        if (!isDragging) {
          towerAngle += towerAngularVel;
          towerAngularVel *= 0.92;
        }

        // Gravedad de la bola
        ball.vy += 0.58;
        ball.worldY += ball.vy;

        // Modo Supernova / Fireball si cae 3 o más pisos seguidos
        if (ball.consecutiveFalls >= 3) {
          if (!ball.isFireball) {
            ball.isFireball = true;
            playFireballWhoosh();
            showToast('🔥 ¡SUPERNOVA IMPARABLE!');
          }
          // Partículas de estela de fuego
          particles.push({
            x: width / 2 + (Math.random() - 0.5) * 14,
            y: height * 0.42 + (Math.random() - 0.5) * 10,
            vx: (Math.random() - 0.5) * 2,
            vy: -3 - Math.random() * 3,
            color: Math.random() < 0.5 ? '#ffd32a' : '#ff4757',
            size: 3 + Math.random() * 4,
            alpha: 1
          });
        }

        // Cámara sigue a la bola con interpolación suave
        const targetCamY = ball.worldY - 120;
        cameraY += (targetCamY - cameraY) * 0.16;

        // Detección de colisión con cada piso
        // El punto de impacto de la bola se sitúa exactamente al frente de la torre (ángulo frontal = -PI / 2)
        const hitAngle = -Math.PI / 2;

        for (let i = 0; i < floors.length; i++) {
          const floor = floors[i];
          if (floor.shattered) continue;

          // Si la bola está cruzando la altura del piso
          if (ball.worldY >= floor.worldY - 10 && ball.worldY <= floor.worldY + 16 && ball.vy > 0) {
            if (floor.isGoal) {
              // ¡NIVEL COMPLETADO!
              playSmashSound();
              showToast('🏆 ¡NIVEL HELIX SUPERADO!');
              score += 100;
              hudFloor.innerText = score;
              createLevel();
              ball.worldY = 0;
              ball.vy = -10;
              return;
            }

            // Normalizar ángulo en el sistema rotado de la torre
            let relAngle = (hitAngle - towerAngle) % (Math.PI * 2);
            if (relAngle < 0) relAngle += Math.PI * 2;

            // Comprobar si el ángulo cae en algún sector sólido
            let hitSector = null;
            for (let s = 0; s < floor.sectors.length; s++) {
              const sec = floor.sectors[s];
              if (relAngle >= sec.startAngle && relAngle <= sec.endAngle) {
                hitSector = sec;
                break;
              }
            }

            if (hitSector) {
              // Impactó un sector sólido
              if (ball.isFireball) {
                // ¡MODO SUPERNOVA: DESTROZA EL PISO Y SIGUE CAYENDO!
                floor.shattered = true;
                ball.consecutiveFalls = 0;
                ball.isFireball = false;
                score += 5;
                spawnShatterEffect(floor.worldY, hitSector.type === 'DANGER' ? '#ff4757' : '#00f0ff');
                // Continúa cayendo con velocidad
                ball.vy = 4;
              } else if (hitSector.type === 'DANGER' && Date.now() > ball.invulnerableTime) {
                // GAME OVER: Tocó zona roja de antimateria
                triggerGameOver(floor);
                return;
              } else {
                // Rebote normal en plataforma
                ball.worldY = floor.worldY - 10;
                ball.vy = -12; // Rebote hacia arriba
                ball.consecutiveFalls = 0;
                ball.isFireball = false;
                playBounceSound(Math.min(7, Math.floor(score % 8)));

                // Dejar salpicadura visual de pintura neón
                floor.splat = {
                  angle: relAngle,
                  color: '#00f0ff'
                };
              }
            } else {
              // Cayó por el hueco: ¡Piso superado!
              ball.consecutiveFalls++;
              score++;
              hudFloor.innerText = score;
              if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('gv_helix_best', bestScore);
                hudBest.innerText = bestScore;
              }
              // Barra de progreso del nivel
              const currentFloorIndex = Math.min(TOTAL_LEVEL_FLOORS, Math.floor(ball.worldY / FLOOR_SPACING));
              progressBar.style.width = `${Math.min(100, (currentFloorIndex / TOTAL_LEVEL_FLOORS) * 100)}%`;
            }
          }
        }

        // Actualizar partículas
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= 0.04;
          if (p.alpha <= 0) particles.splice(i, 1);
        }

        // Amortiguar sacudida de pantalla
        if (screenShake > 0) screenShake *= 0.85;
      }

      // --- DIBUJADO DE LA TORRE HELICOIDAL EN CANVAS ---
      function draw() {
        ctx.clearRect(0, 0, width, height);

        ctx.save();
        if (screenShake > 0.5) {
          ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        }

        const centerX = width / 2;
        const ballScreenY = height * 0.42;

        // 1. Dibujar Pilar Central de energía
        ctx.save();
        const gradPillar = ctx.createLinearGradient(centerX - PILLAR_RADIUS, 0, centerX + PILLAR_RADIUS, 0);
        gradPillar.addColorStop(0, '#0a1032');
        gradPillar.addColorStop(0.5, '#1e2b6e');
        gradPillar.addColorStop(1, '#0a1032');
        ctx.fillStyle = gradPillar;
        ctx.fillRect(centerX - PILLAR_RADIUS, 0, PILLAR_RADIUS * 2, height);
        ctx.restore();

        // 2. Dibujar Pisos / Plataformas visibles
        for (let i = 0; i < floors.length; i++) {
          const floor = floors[i];
          if (floor.shattered) continue;

          // Proyección vertical relativa a la cámara
          const screenY = ballScreenY + (floor.worldY - cameraY);

          // Omitir si está fuera de pantalla
          if (screenY < -80 || screenY > height + 80) continue;

          // Dibujar sectores del disco
          for (let s = 0; s < floor.sectors.length; s++) {
            const sec = floor.sectors[s];
            const startA = sec.startAngle + towerAngle;
            const endA = sec.endAngle + towerAngle;

            ctx.save();
            if (sec.type === 'DANGER') {
              ctx.fillStyle = '#ff3838';
              ctx.strokeStyle = '#ff6b81';
              ctx.shadowColor = '#ff3838';
              ctx.shadowBlur = 10;
            } else if (sec.type === 'GOAL') {
              ctx.fillStyle = '#2ed573';
              ctx.strokeStyle = '#7bed9f';
              ctx.shadowColor = '#2ed573';
              ctx.shadowBlur = 15;
            } else {
              ctx.fillStyle = '#00a8ff';
              ctx.strokeStyle = '#00f0ff';
              ctx.shadowColor = 'rgba(0, 240, 255, 0.4)';
              ctx.shadowBlur = 8;
            }

            // Dibujar cara superior en elipse 3D
            ctx.beginPath();
            ctx.ellipse(centerX, screenY, TOWER_RADIUS_X, TOWER_RADIUS_Y, 0, startA, endA);
            ctx.ellipse(centerX, screenY, PILLAR_RADIUS, PILLAR_RADIUS * 0.35, 0, endA, startA, true);
            ctx.closePath();
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Dibujar grosor / relieve 3D del borde frontal
            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.beginPath();
            ctx.ellipse(centerX, screenY + 8, TOWER_RADIUS_X, TOWER_RADIUS_Y, 0, startA, endA);
            ctx.ellipse(centerX, screenY, TOWER_RADIUS_X, TOWER_RADIUS_Y, 0, endA, startA, true);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
          }
        }

        // 3. Dibujar la Bola de Energía (fija en el centro de pantalla)
        ctx.save();
        if (ball.isFireball) {
          ctx.fillStyle = '#ffd32a';
          ctx.shadowColor = '#ff4757';
          ctx.shadowBlur = 24;
        } else {
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = '#00f0ff';
          ctx.shadowBlur = 16;
        }
        ctx.beginPath();
        // Deformación elástica (squash & stretch al botar)
        const stretchY = Math.min(1.3, Math.max(0.75, 1 - ball.vy * 0.025));
        const stretchX = 1 / stretchY;
        ctx.ellipse(centerX, ballScreenY, ball.radius * stretchX, ball.radius * stretchY, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 4. Dibujar Partículas
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        ctx.restore();
      }

      // --- BUCLE PRINCIPAL (60 FPS) ---
      function loop() {
        updatePhysics();
        draw();
        requestAnimationFrame(loop);
      }

      // --- GAME OVER & REVIVIR ---
      function triggerGameOver(failedFloor) {
        gameState = 'GAMEOVER';
        finalScoreEl.innerText = score;
        modalGameOver.classList.add('active');
        playTone(140, 0.45, 'sawtooth', 0.15);

        if (window.GamerVerse) {
          window.GamerVerse.submitScore('cosmic_helix', score, 0);
        }

        if (hasRevivedThisRun) {
          btnRevive.style.display = 'none';
        } else {
          btnRevive.style.display = 'flex';
          btnRevive.disabled = false;
        }
      }

      function reviveGame() {
        btnRevive.disabled = true;
        btnRevive.innerText = 'Cargando...';

        const onReward = () => {
          hasRevivedThisRun = true;
          modalGameOver.classList.remove('active');
          gameState = 'PLAYING';
          lastInterstitialAdTime = Date.now();

          // Destruir el piso donde murió y darle escudo de 5 segundos
          for (let i = 0; i < floors.length; i++) {
            if (Math.abs(floors[i].worldY - ball.worldY) < FLOOR_SPACING * 0.8) {
              floors[i].shattered = true;
              spawnShatterEffect(floors[i].worldY, '#00f0ff');
            }
          }
          ball.vy = -12;
          ball.invulnerableTime = Date.now() + 5000;
          showToast('🛡️ ¡ESCUDO SUPERNOVA ACTIVO!');
        };

        if (window.GamerVerse && typeof window.GamerVerse.showRewardedAd === 'function') {
          window.GamerVerse.showRewardedAd(onReward, (err) => {
            btnRevive.disabled = false;
            btnRevive.innerText = '📺 REVIVIR CON SUPERNOVA (1 AD)';
          });
        } else {
          onReward();
        }
      }

      function resetNewGame() {
        modalGameOver.classList.remove('active');

        if (window.GamerVerse && !window.GamerVerse.canPlay()) {
          window.GamerVerse.showNoTicketsModal(() => resetNewGame());
          return;
        }
        if (window.GamerVerse) {
          window.GamerVerse.consumeTicket();
        }

        const startFresh = () => {
          score = 0;
          hudFloor.innerText = score;
          hasRevivedThisRun = false;
          ball.worldY = 0;
          ball.vy = 0;
          ball.consecutiveFalls = 0;
          ball.isFireball = false;
          ball.invulnerableTime = 0;
          cameraY = 0;
          towerAngle = 0;
          towerAngularVel = 0;
          createLevel();
          gameState = 'PLAYING';
        };

        // Mostrar intersticial al reiniciar si pasaron más de 2 minutos
        const now = Date.now();
        if (now - lastInterstitialAdTime >= INTERSTITIAL_INTERVAL_MS && window.GamerVerse && typeof window.GamerVerse.showInterstitialAd === 'function') {
          lastInterstitialAdTime = now;
          window.GamerVerse.showInterstitialAd(startFresh);
        } else {
          startFresh();
        }
      }

      // --- BOTONES ---
      btnRevive.addEventListener('click', reviveGame);
      btnRetry.addEventListener('click', resetNewGame);
      btnSound.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        btnSound.innerText = soundEnabled ? '🔊' : '🔇';
      });
      btnBack.addEventListener('click', () => {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'GV_CLOSE_GAME' }, '*');
        } else {
          window.location.href = '../index.html';
        }
      });
      btnExitHub.addEventListener('click', () => {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'GV_CLOSE_GAME' }, '*');
        } else {
          window.location.href = '../index.html';
        }
      });

      // --- INICIALIZACIÓN ---
      function init() {
        resize();
        hudBest.innerText = bestScore;
        createLevel();

        if (window.GamerVerse && typeof window.GamerVerse.canPlay === 'function' && !window.GamerVerse.canPlay()) {
          window.GamerVerse.showNoTicketsModal(() => init());
          return;
        }
        if (window.GamerVerse && typeof window.GamerVerse.consumeTicket === 'function') {
          window.GamerVerse.consumeTicket();
        }

        requestAnimationFrame(loop);
      }

      window.addEventListener('DOMContentLoaded', init);
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        init();
      }
    })();
  </script>
