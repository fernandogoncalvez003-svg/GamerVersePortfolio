<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Stack Tower Neon · GameVerse 307</title>
  <meta name="monetag-zone" content="12242572" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="./gamerverse-bridge.js?v=20261112"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #030514;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: radial-gradient(circle at 50% 25%, #0b112c 0%, #030514 100%);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 6px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(6, 10, 28, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      z-index: 20;
    }
    .hud-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hud-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #7b8dbb;
      text-transform: uppercase;
    }
    .hud-val {
      font-family: 'Orbitron', monospace;
      font-size: 26px;
      font-weight: 900;
      color: #00f0ff;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
      line-height: 1.1;
    }
    .btn-ctrl {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-ctrl:active {
      transform: scale(0.95);
    }
    #canvas-wrap {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Modales */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 5, 18, 0.88);
      backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
      text-align: center;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      width: 100%;
      max-width: 330px;
      background: rgba(14, 20, 50, 0.95);
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .modal-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: 900;
      color: #ff4757;
      text-shadow: 0 0 14px rgba(255, 71, 87, 0.6);
    }
    .modal-score {
      font-family: 'Orbitron', monospace;
      font-size: 42px;
      font-weight: 900;
      color: #00f0ff;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
    }
    .btn-action {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-revive {
      background: linear-gradient(135deg, #ffd32a 0%, #ff9f43 100%);
      color: #050713;
      box-shadow: 0 0 20px rgba(255, 211, 42, 0.4);
    }
    .btn-retry {
      background: linear-gradient(135deg, #00f0ff 0%, #0072ff 100%);
      color: #fff;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.35);
    }
    .btn-hub {
      background: transparent;
      color: #7b8dbb;
      border: 1px solid rgba(123, 141, 187, 0.25);
      font-size: 11px;
    }
    .toast {
      position: absolute;
      top: 75px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(0, 240, 255, 0.95);
      color: #050713;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 800;
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
      pointer-events: none;
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 80;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <header>
      <button class="btn-ctrl" id="btn-back">🏠 Hub</button>
      <div class="hud-stat">
        <span class="hud-label">Pisos</span>
        <span class="hud-val" id="hud-score">0</span>
      </div>
      <div style="font-family: 'Orbitron', monospace; font-size: 12px; color: #ffd32a;">
        Récord: <span id="hud-best">0</span>
      </div>
      <button class="btn-ctrl" id="btn-sound">🔊</button>
    </header>

    <div id="canvas-wrap">
      <canvas id="game-canvas"></canvas>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Modal Game Over -->
    <div class="modal-overlay" id="modal-gameover">
      <div class="modal-card">
        <div style="font-size: 40px;">💥</div>
        <h2 class="modal-title">¡TORRE DERRUMBADA!</h2>
        <p style="font-size: 13px; color: #a4b0be;">El bloque cayó fuera de la estructura.</p>
        <div>
          <div style="font-size: 11px; text-transform: uppercase; color: #7b8dbb; letter-spacing: 1px;">Altura Alcanzada</div>
          <div class="modal-score" id="final-score">0</div>
        </div>

        <button class="btn-action btn-revive" id="btn-revive">
          <span>📺</span> EXPANDIR BASE (1 AD)
        </button>

        <button class="btn-action btn-retry" id="btn-retry">
          <span>🔄</span> APILAR OTRA VEZ (1 🎟️)
        </button>

        <button class="btn-action btn-hub" id="btn-exit-hub">
          VOLVER AL HUB ARCADE
        </button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // --- AUDIO PROCEDURAL SINTETIZADO ---
      let audioCtx = null;
      let soundEnabled = true;

      function initAudio() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      }

      function playTone(freq, dur, type = 'sine', gainVal = 0.08) {
        if (!soundEnabled || !audioCtx) return;
        try {
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(gainVal, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + dur);
        } catch (_) {}
      }

      function playPlacementSound(combo) {
        // Escala cromática / pentatónica que sube con combos perfectos
        const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33, 659.25];
        const freq = notes[combo % notes.length];
        playTone(freq, 0.14, 'triangle', 0.09);
      }

      function playSliceSound() {
        playTone(180, 0.12, 'sawtooth', 0.07);
      }

      function playExpandChime() {
        playTone(523.25, 0.1, 'sine', 0.09);
        setTimeout(() => playTone(659.25, 0.12, 'sine', 0.09), 50);
        setTimeout(() => playTone(783.99, 0.18, 'sine', 0.09), 100);
      }

      // --- ELEMENTOS DOM ---
      const canvasWrap = document.getElementById('canvas-wrap');
      const canvas = document.getElementById('game-canvas');
      const ctx = canvas.getContext('2d');
      const hudScore = document.getElementById('hud-score');
      const hudBest = document.getElementById('hud-best');
      const modalGameOver = document.getElementById('modal-gameover');
      const finalScoreEl = document.getElementById('final-score');
      const btnRevive = document.getElementById('btn-revive');
      const btnRetry = document.getElementById('btn-retry');
      const btnBack = document.getElementById('btn-back');
      const btnExitHub = document.getElementById('btn-exit-hub');
      const btnSound = document.getElementById('btn-sound');
      const toastEl = document.getElementById('toast');

      function showToast(text) {
        toastEl.innerText = text;
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), 2200);
      }

      // --- PARÁMETROS DEL JUEGO ---
      let width = 0;
      let height = 0;
      let dpr = 1;
      let score = 0;
      let bestScore = parseInt(localStorage.getItem('gv_stack_best') || '0', 10);
      let gameState = 'PLAYING'; // 'PLAYING', 'GAMEOVER'
      let screenShake = 0;

      // Publicidad: cada 2 minutos
      const INTERSTITIAL_INTERVAL_MS = 120000;
      let lastInterstitialAdTime = Date.now();
      let hasRevivedThisRun = false;

      // Constantes de apilado
      const BLOCK_HEIGHT = 28;
      const INITIAL_BLOCK_WIDTH = 220;

      let cameraY = 0;
      let targetCameraY = 0;
      let stack = []; // Bloques fijados en la torre
      let activeBlock = null; // Bloque en movimiento horizontal
      let fallingDebris = []; // Partes recortadas que caen con física
      let particles = [];
      let perfectStreak = 0;

      // Generador de color arcoíris neón procedural
      function getBlockColor(level) {
        const hue = (level * 16) % 360;
        return `hsl(${hue}, 85%, 55%)`;
      }

      // --- INICIALIZAR TORRE ---
      function initTower() {
        stack = [];
        fallingDebris = [];
        particles = [];
        score = 0;
        perfectStreak = 0;
        cameraY = 0;
        targetCameraY = 0;

        // Base inicial ancha
        const baseWidth = INITIAL_BLOCK_WIDTH;
        const baseX = (width - baseWidth) / 2;
        const baseY = height - 120;

        stack.push({
          x: baseX,
          y: baseY,
          width: baseWidth,
          color: getBlockColor(0)
        });

        spawnNextActiveBlock();
      }

      function spawnNextActiveBlock() {
        const topBlock = stack[stack.length - 1];
        const nextY = topBlock.y - BLOCK_HEIGHT;
        const speed = Math.min(7.5, 3.8 + stack.length * 0.08);
        const direction = Math.random() < 0.5 ? 1 : -1;
        const startX = direction === 1 ? -topBlock.width : width;

        activeBlock = {
          x: startX,
          y: nextY,
          width: topBlock.width,
          speed: speed * direction,
          color: getBlockColor(stack.length)
        };

        targetCameraY = Math.max(0, (stack.length - 6) * BLOCK_HEIGHT);
      }

      // --- AJUSTE RESPONSIVE CANVAS ---
      function resize() {
        const rect = canvasWrap.getBoundingClientRect();
        width = rect.width;
        height = rect.height;
        dpr = window.devicePixelRatio || 1;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.resetTransform ? ctx.resetTransform() : ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);

        if (stack.length === 0) {
          initTower();
        }
      }
      window.addEventListener('resize', resize);
      window.addEventListener('orientationchange', () => setTimeout(resize, 200));

      // --- DETENER Y COLOCAR BLOQUE (MECÁNICA CLAVE) ---
      function placeBlock() {
        initAudio();
        if (gameState !== 'PLAYING' || !activeBlock) return;

        const topBlock = stack[stack.length - 1];
        const diff = activeBlock.x - topBlock.x;
        const absDiff = Math.abs(diff);

        // Si falló completamente la torre: Game Over
        if (absDiff >= activeBlock.width) {
          // Bloque entero cae al abismo
          fallingDebris.push({
            x: activeBlock.x,
            y: activeBlock.y,
            width: activeBlock.width,
            vy: 2,
            rot: 0,
            vRot: (Math.random() - 0.5) * 0.1,
            color: activeBlock.color
          });
          activeBlock = null;
          triggerGameOver();
          return;
        }

        // ¿COLOCACIÓN PERFECTA? (tolerancia de 3 píxeles)
        const isPerfect = absDiff <= 3;

        let newX = activeBlock.x;
        let newWidth = activeBlock.width - absDiff;

        if (isPerfect) {
          // Alinear perfectamente
          newX = topBlock.x;
          newWidth = topBlock.width;
          perfectStreak++;
          playPlacementSound(perfectStreak);
          showToast(`✨ ¡PERFECTO! x${perfectStreak}`);

          // Cada 3 perfectos, la torre se expande de nuevo
          if (perfectStreak % 3 === 0) {
            newWidth = Math.min(INITIAL_BLOCK_WIDTH, newWidth + 12);
            newX = Math.max(10, newX - 6);
            playExpandChime();
            showToast('🌟 ¡BASE EXPANDIDA!');
          }

          // Partículas de celebración
          for (let i = 0; i < 14; i++) {
            particles.push({
              x: newX + Math.random() * newWidth,
              y: activeBlock.y,
              vx: (Math.random() - 0.5) * 4,
              vy: -2 - Math.random() * 3,
              color: '#ffffff',
              size: 2 + Math.random() * 3,
              alpha: 1
            });
          }
        } else {
          // No perfecto: recortar el exceso
          perfectStreak = 0;
          playSliceSound();

          // El pedazo cortado cae al vacío
          let debrisX = diff > 0 ? topBlock.x + topBlock.width : activeBlock.x;
          let debrisWidth = absDiff;

          fallingDebris.push({
            x: debrisX,
            y: activeBlock.y,
            width: debrisWidth,
            vy: 1,
            rot: 0,
            vRot: (diff > 0 ? 0.05 : -0.05),
            color: activeBlock.color
          });

          // Ajustar coordenada del bloque que queda fijado
          if (diff < 0) {
            newX = topBlock.x;
          }
        }

        // Fijar bloque en la torre
        stack.push({
          x: newX,
          y: activeBlock.y,
          width: newWidth,
          color: activeBlock.color
        });

        score = stack.length - 1;
        hudScore.innerText = score;
        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem('gv_stack_best', bestScore);
          hudBest.innerText = bestScore;
        }

        // Crear siguiente piso en movimiento
        spawnNextActiveBlock();
      }

      canvasWrap.addEventListener('mousedown', placeBlock);
      canvasWrap.addEventListener('touchstart', (e) => {
        e.preventDefault();
        placeBlock();
      }, { passive: false });

      // --- FÍSICA Y ACTUALIZACIÓN (60 FPS) ---
      function updatePhysics() {
        if (gameState !== 'PLAYING') return;

        // Movimiento de vaivén del bloque activo
        if (activeBlock) {
          activeBlock.x += activeBlock.speed;
          if (activeBlock.x + activeBlock.width > width + 40) {
            activeBlock.x = width + 40 - activeBlock.width;
            activeBlock.speed = -Math.abs(activeBlock.speed);
          } else if (activeBlock.x < -40) {
            activeBlock.x = -40;
            activeBlock.speed = Math.abs(activeBlock.speed);
          }
        }

        // Interpolación suave de la cámara vertical
        cameraY += (targetCameraY - cameraY) * 0.1;

        // Físicas de escombros cortados cayendo
        for (let i = fallingDebris.length - 1; i >= 0; i--) {
          const d = fallingDebris[i];
          d.vy += 0.45;
          d.y += d.vy;
          d.rot += d.vRot;
          if (d.y - cameraY > height + 60) {
            fallingDebris.splice(i, 1);
          }
        }

        // Partículas
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= 0.04;
          if (p.alpha <= 0) particles.splice(i, 1);
        }

        if (screenShake > 0) screenShake *= 0.85;
      }

      // --- DIBUJADO EN CANVAS (60 FPS) ---
      function draw() {
        ctx.clearRect(0, 0, width, height);

        ctx.save();
        if (screenShake > 0.5) {
          ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        }

        // 1. Dibujar Bloques fijados de la Torre
        for (let i = 0; i < stack.length; i++) {
          const b = stack[i];
          const sy = b.y + cameraY;
          if (sy < -BLOCK_HEIGHT || sy > height + BLOCK_HEIGHT) continue;

          ctx.save();
          ctx.fillStyle = b.color;
          ctx.shadowColor = b.color;
          ctx.shadowBlur = 10;

          // Rectángulo redondeado
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(b.x, sy, b.width, BLOCK_HEIGHT, 4) : ctx.rect(b.x, sy, b.width, BLOCK_HEIGHT);
          ctx.fill();

          // Brillo superior 3D
          ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
          ctx.fillRect(b.x, sy, b.width, 3);
          ctx.restore();
        }

        // 2. Dibujar Bloque activo en movimiento
        if (activeBlock) {
          const sy = activeBlock.y + cameraY;
          ctx.save();
          ctx.fillStyle = activeBlock.color;
          ctx.shadowColor = activeBlock.color;
          ctx.shadowBlur = 15;
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(activeBlock.x, sy, activeBlock.width, BLOCK_HEIGHT, 4) : ctx.rect(activeBlock.x, sy, activeBlock.width, BLOCK_HEIGHT);
          ctx.fill();

          ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
          ctx.fillRect(activeBlock.x, sy, activeBlock.width, 3);
          ctx.restore();
        }

        // 3. Dibujar Escombros cortados cayendo
        for (let i = 0; i < fallingDebris.length; i++) {
          const d = fallingDebris[i];
          const sy = d.y + cameraY;
          ctx.save();
          ctx.translate(d.x + d.width / 2, sy + BLOCK_HEIGHT / 2);
          ctx.rotate(d.rot);
          ctx.fillStyle = d.color;
          ctx.shadowColor = d.color;
          ctx.shadowBlur = 8;
          ctx.fillRect(-d.width / 2, -BLOCK_HEIGHT / 2, d.width, BLOCK_HEIGHT);
          ctx.restore();
        }

        // 4. Dibujar Partículas
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(p.x, p.y + cameraY, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        ctx.restore();
      }

      // --- BUCLE PRINCIPAL (60 FPS) ---
      function loop() {
        updatePhysics();
        draw();
        requestAnimationFrame(loop);
      }

      // --- GAME OVER & REVIVIR ---
      function triggerGameOver() {
        gameState = 'GAMEOVER';
        screenShake = 14;
        playSliceSound();
        finalScoreEl.innerText = score;
        modalGameOver.classList.add('active');

        if (window.GamerVerse) {
          window.GamerVerse.submitScore('stack_tower', score, 0);
        }

        if (hasRevivedThisRun) {
          btnRevive.style.display = 'none';
        } else {
          btnRevive.style.display = 'flex';
          btnRevive.disabled = false;
        }
      }

      function reviveGame() {
        btnRevive.disabled = true;
        btnRevive.innerText = 'Cargando...';

        const onReward = () => {
          hasRevivedThisRun = true;
          modalGameOver.classList.remove('active');
          gameState = 'PLAYING';
          lastInterstitialAdTime = Date.now();

          // Restaurar la base del bloque superior al ancho completo inicial
          const topBlock = stack[stack.length - 1];
          topBlock.width = INITIAL_BLOCK_WIDTH;
          topBlock.x = (width - INITIAL_BLOCK_WIDTH) / 2;

          spawnNextActiveBlock();
          playExpandChime();
          showToast('🛡️ ¡BASE EXPANDIDA AL MÁXIMO!');
        };

        if (window.GamerVerse && typeof window.GamerVerse.showRewardedAd === 'function') {
          window.GamerVerse.showRewardedAd(onReward, (err) => {
            btnRevive.disabled = false;
            btnRevive.innerText = '📺 EXPANDIR BASE (1 AD)';
          });
        } else {
          onReward();
        }
      }

      function resetNewGame() {
        modalGameOver.classList.remove('active');

        if (window.GamerVerse && !window.GamerVerse.canPlay()) {
          window.GamerVerse.showNoTicketsModal(() => resetNewGame());
          return;
        }
        if (window.GamerVerse) {
          window.GamerVerse.consumeTicket();
        }

        const startFresh = () => {
          hasRevivedThisRun = false;
          initTower();
          gameState = 'PLAYING';
        };

        const now = Date.now();
        if (now - lastInterstitialAdTime >= INTERSTITIAL_INTERVAL_MS && window.GamerVerse && typeof window.GamerVerse.showInterstitialAd === 'function') {
          lastInterstitialAdTime = now;
          window.GamerVerse.showInterstitialAd(startFresh);
        } else {
          startFresh();
        }
      }

      // --- BOTONES ---
      btnRevive.addEventListener('click', reviveGame);
      btnRetry.addEventListener('click', resetNewGame);
      btnSound.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        btnSound.innerText = soundEnabled ? '🔊' : '🔇';
      });
      btnBack.addEventListener('click', () => {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'GV_CLOSE_GAME' }, '*');
        } else {
          window.location.href = '../index.html';
        }
      });
      btnExitHub.addEventListener('click', () => {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'GV_CLOSE_GAME' }, '*');
        } else {
          window.location.href = '../index.html';
        }
      });

      // --- INICIALIZACIÓN ---
      function init() {
        resize();
        hudBest.innerText = bestScore;

        if (window.GamerVerse && typeof window.GamerVerse.canPlay === 'function' && !window.GamerVerse.canPlay()) {
          window.GamerVerse.showNoTicketsModal(() => init());
          return;
        }
        if (window.GamerVerse && typeof window.GamerVerse.consumeTicket === 'function') {
          window.GamerVerse.consumeTicket();
        }

        requestAnimationFrame(loop);
      }

      window.addEventListener('DOMContentLoaded', init);
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        init();
      }
    })();
  </script>
</body>
</html>
